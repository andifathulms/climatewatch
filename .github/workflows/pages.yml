name: Deploy static build to GitHub Pages

# Iklim's live REST API (Django + Celery + TimescaleDB) still runs unchanged
# wherever it's deployed — this workflow is a separate, additive path that
# publishes a static Next.js export of the same data, so the app can also be
# viewed for free on GitHub Pages. Nothing here replaces the backend or its
# docker-compose stack.
#
# The climate JSON itself lives in `data/static_export/` and is committed to
# the repo, refreshed by periodically running (from a machine that isn't a
# cloud CI IP — see below) from `backend/`:
#
#   python manage.py export_static --out ../data/static_export
#
# This workflow does NOT run climate_bootstrap in CI. It did originally, but
# Open-Meteo's archive API reliably times out / rate-limits requests coming
# from GitHub Actions runners (a common pattern for free APIs throttling
# well-known cloud/CI IP ranges) — every attempt either returned nothing or
# stalled for 25+ minutes before giving up. Running the real ingestion from a
# normal residential/office IP and committing the resulting JSON sidesteps
# that entirely. The tradeoff: data here is a point-in-time snapshot, not
# auto-refreshed daily — re-run the export above and push when you want
# fresher numbers.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy the committed climate export into the frontend's public/ dir
        run: |
          mkdir -p frontend/public/data
          cp -r data/static_export/. frontend/public/data/

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build static export
        working-directory: frontend
        env:
          NEXT_PUBLIC_DATA_MODE: static
          # Must match the repo name — this is a GitHub Pages *project* site
          # (github.com/<user>/climatewatch -> <user>.github.io/climatewatch/).
          NEXT_PUBLIC_BASE_PATH: /climatewatch
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
